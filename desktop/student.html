<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>MyOpenProctor</title><style>body{font-family:system-ui;margin:0;background:#f4f6fb;color:#182033}.wrap{max-width:760px;margin:60px auto;padding:24px}.card{background:white;padding:32px;border-radius:20px;box-shadow:0 15px 50px #1d2b4b1c}h1{color:#4b2275}input{width:100%;padding:14px;margin:7px 0 18px;border:1px solid #c9ced8;border-radius:10px;font-size:16px;box-sizing:border-box}button{padding:13px 20px;border:0;border-radius:10px;font-weight:700;cursor:pointer}.primary{background:#5a2a82;color:white}.danger{background:#a92525;color:white}.notice{padding:14px;background:#fff3cd;border-radius:10px;margin:15px 0}.event{font-size:13px;padding:8px;border-bottom:1px solid #eee}</style></head><body><div class="wrap"><div class="card"><h1>MyOpenProctor</h1><p>Secure exam client — development build</p><div class="notice">Before a real exam, this client will display the instructor's recording and resource policy and require explicit consent.</div><label>Student name</label><input id="student"><label>Exam access code</label><input id="code"><label>Test assessment URL</label><input id="url" placeholder="https://www.myopenmath.com/..."><button class="primary" id="start">Start Exam</button><button class="danger" id="end">End Session</button><h3>Session events</h3><div id="events"></div></div></div><script>const events=document.getElementById('events');function add(x){const d=document.createElement('div');d.className='event';d.textContent=(x.time||new Date().toISOString())+' — '+x.message;events.prepend(d)}window.myOpenProctor.onEvent(add);document.getElementById('start').onclick=async()=>{const url=document.getElementById('url').value;if(!url)return alert('Enter a test assessment URL');add({message:'Student started exam session'});try{await window.myOpenProctor.openExam(url)}catch(e){alert(e.message)}};document.getElementById('end').onclick=async()=>{add({message:'Student ended session'});await window.myOpenProctor.endSession()};</script></body></html>
